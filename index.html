    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "UNIGATES",
        "url": "https://unigates.online",
        "logo": "https://unigates.online/og-logo.png",
        "parentOrganization": { "@type": "Organization", "name": "Dar Obeid" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "UNIGATES",
        "url": "https://unigates.online"
      }
    </script>
    <script>
      // Evict any stale Service Worker BEFORE module scripts load.
      // A leftover SW from a previous deploy can intercept /src/main.tsx and
      // return the wrong MIME type ("application/octet-stream"), which the
      // browser refuses to execute per strict MIME rules.
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (!regs || !regs.length) return;
              var RELOAD_KEY = '__unigates_sw_evicted__';
              Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
                var clearCaches = ('caches' in window)
                  ? caches.keys().then(function (keys) {
                      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    })
                  : Promise.resolve();
                return clearCaches;
              }).then(function () {
                if (!sessionStorage.getItem(RELOAD_KEY)) {
                  sessionStorage.setItem(RELOAD_KEY, '1');
                  location.reload();
                }
              }).catch(function () {});
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <!-- Progressive fallback shown before JS boots. React clears it on mount. -->
      <div id="app-boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#ffffff;color:#0f172a;font-family:'Cairo','Segoe UI',system-ui,sans-serif;padding:24px;text-align:center;" dir="rtl">
        <img src="/loading-logo.png" alt="UNIGATES" style="width:180px;height:auto;animation:unig-pulse 1.6s ease-in-out infinite;" />
        <div id="app-boot-slow" style="display:none;margin-top:18px;max-width:420px;">
          <div style="font-size:13px;line-height:1.7;opacity:0.75;margin-bottom:12px;">
            يستغرق التحميل وقتًا أطول من المعتاد. تحقّق من اتصالك بالإنترنت.
          </div>
          <button onclick="sessionStorage.removeItem('__unigates_chunk_reload__');location.reload();" style="padding:9px 20px;border-radius:8px;border:none;cursor:pointer;background:#2563eb;color:#fff;font-size:14px;font-weight:600;font-family:inherit;">
            إعادة المحاولة
          </button>
        </div>
        <style>@keyframes unig-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.96)}}</style>
      </div>

      <script>
        // If the app hasn't mounted after 8s, surface the retry UI.
        setTimeout(function () {
          var el = document.getElementById('app-boot-slow');
          if (el) el.style.display = 'block';
        }, 8000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div style="padding:24px;text-align:center;font-family:sans-serif;">
        يجب تفعيل JavaScript لتشغيل UNIGATES.
      </div>
    </noscript>
  </body>
</html>
