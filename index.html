    <script>
      // Silently unregister any leftover Service Worker from a previous deploy.
      // We do NOT reload here — reloading caused the home page to load twice
      // on returning visitors. The unregister takes effect on the next visit
      // naturally; module scripts on this load are served fresh from the network.
      //
      // IMPORTANT: We intentionally do NOT clear Cache Storage here. Wiping
      // caches on every load forces re-downloading all JS/CSS/images and was
      // the primary cause of the 8-second boot timeout.
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (!regs || !regs.length) return;
              regs.forEach(function (r) { r.unregister().catch(function () {}); });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>

    <!-- Suppress Lovable Badge / Overlay -->
    <style>
      #lovable-badge,
      .lovable-badge,
      [id*="lovable-badge"],
      [class*="lovable-badge"],
      [data-lovable-badge],
      a[href*="lovable.dev"],
      a[href*="lovable.app"],
      div:has(> a[href*="lovable.dev"]),
      div:has(> a[href*="lovable.app"]) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        z-index: -99999 !important;
        transform: scale(0) !important;
        position: absolute !important;
        left: -99999px !important;
        top: -99999px !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
    <script>
      (function () {
        function removeLovable() {
          try {
            // Target by links/ids/classes
            var els = document.querySelectorAll('a[href*="lovable.dev"], a[href*="lovable.app"], [id*="lovable-badge"], [class*="lovable-badge"], [data-lovable-badge]');
            for (var i = 0; i < els.length; i++) {
              var parent = els[i].closest('div[style*="fixed"], div[class*="fixed"], [id*="lovable"]') || els[i];
              if (parent && parent.parentNode) {
                parent.parentNode.removeChild(parent);
              }
            }
            // Target by text content
            var buttons = document.querySelectorAll('button, a, div');
            for (var j = 0; j < buttons.length; j++) {
              var text = (buttons[j].textContent || '').trim();
              if (text.indexOf('Edit with') !== -1 && text.indexOf('Lovable') !== -1) {
                var container = buttons[j].closest('div[style*="fixed"], div[class*="fixed"]') || buttons[j];
                if (container && container.parentNode) {
                  container.parentNode.removeChild(container);
                }
              }
            }
          } catch (e) {}
        }
        if (typeof document !== 'undefined') {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', removeLovable);
          } else {
            removeLovable();
          }
          if (window.MutationObserver) {
            var obs = new MutationObserver(removeLovable);
            obs.observe(document.documentElement, { childList: true, subtree: true });
          }
          setInterval(removeLovable, 1000);
        }
      })();
    </script>

  <body>
    <div id="root">
      <!-- Progressive fallback shown before JS boots. React clears it on mount. -->
      <div id="app-boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#ffffff;color:#0f172a;font-family:'Cairo','Segoe UI',system-ui,sans-serif;padding:24px;text-align:center;" dir="rtl">
        <img src="/loading-logo.png" alt="UNIGATES" style="width:180px;height:auto;animation:unig-pulse 1.6s ease-in-out infinite;" />
        <div id="app-boot-slow" style="display:none;margin-top:18px;max-width:420px;">
          <div style="font-size:13px;line-height:1.7;opacity:0.75;margin-bottom:12px;">
            يستغرق التحميل وقتًا أطول من المعتاد. تحقّق من اتصالك بالإنترنت.
          </div>
          <button onclick="sessionStorage.removeItem('__unigates_chunk_reload__');location.reload();" style="padding:9px 20px;border-radius:8px;border:none;cursor:pointer;background:#2563eb;color:#fff;font-size:14px;font-weight:600;font-family:inherit;">
            إعادة المحاولة
          </button>
        </div>
        <style>@keyframes unig-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.96)}}</style>
      </div>

      <script>
        // If the app hasn't mounted after 8s, surface the retry UI.
        setTimeout(function () {
          var el = document.getElementById('app-boot-slow');
          if (el) el.style.display = 'block';
        }, 8000);
      </script>
    </div>
