<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIGATES — Arabic & English Educational Platform</title>
    <meta name="description" content="UNIGATES by Dar Obeid: online courses, a digital book store, and K-12 / university platforms for students, teachers, and institutions." />
    <meta name="author" content="UNIGATES" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://tgdkxzzkvfyazmnawkpw.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://tgdkxzzkvfyazmnawkpw.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="modulepreload" href="/src/main.tsx" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="UNIGATES — Educational Platform" />
    <meta property="og:description" content="Online courses, book store, and school & university platforms by Dar Obeid." />
    <meta property="og:image" content="https://unigates.online/og-logo.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:url" content="https://unigates.online" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@UNIGATES" />
    <meta name="twitter:title" content="UNIGATES — Educational Platform" />
    <meta name="twitter:description" content="Online courses, book store, and school & university platforms by Dar Obeid." />
    <meta name="twitter:image" content="https://unigates.online/og-logo.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "UNIGATES",
        "url": "https://unigates.online",
        "logo": "https://unigates.online/og-logo.png",
        "parentOrganization": { "@type": "Organization", "name": "Dar Obeid" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "UNIGATES",
        "url": "https://unigates.online"
      }
    </script>
  </head>

  <body>
    <div id="root">
      <!-- Progressive fallback shown before JS boots. React clears it on mount. -->
      <div id="app-boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#ffffff;color:#0f172a;font-family:'Cairo','Segoe UI',system-ui,sans-serif;padding:24px;text-align:center;" dir="rtl">
        <div style="width:44px;height:44px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:unig-spin 0.9s linear infinite;margin-bottom:18px;"></div>
        <div style="font-size:15px;font-weight:600;opacity:0.85;">جارٍ تحميل UNIGATES…</div>
        <div id="app-boot-slow" style="display:none;margin-top:18px;max-width:420px;">
          <div style="font-size:13px;line-height:1.7;opacity:0.75;margin-bottom:12px;">
            يستغرق التحميل وقتًا أطول من المعتاد. تحقّق من اتصالك بالإنترنت.
          </div>
          <button onclick="sessionStorage.removeItem('__unigates_chunk_reload__');location.reload();" style="padding:9px 20px;border-radius:8px;border:none;cursor:pointer;background:#2563eb;color:#fff;font-size:14px;font-weight:600;font-family:inherit;">
            إعادة المحاولة
          </button>
        </div>
        <style>@keyframes unig-spin{to{transform:rotate(360deg)}}</style>
      </div>
      <script>
        // If the app hasn't mounted after 8s, surface the retry UI.
        setTimeout(function () {
          var el = document.getElementById('app-boot-slow');
          if (el) el.style.display = 'block';
        }, 8000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div style="padding:24px;text-align:center;font-family:sans-serif;">
        يجب تفعيل JavaScript لتشغيل UNIGATES.
      </div>
    </noscript>
  </body>
</html>
